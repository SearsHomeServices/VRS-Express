openapi: 3.1.0
info:
  title: VRS Express and VRS AI Authorization Bridge
  version: 8.0.0
  description: |
    Strict V5 and V8 authorize payloads on the same endpoint. VRS Express
    holds every accepted request for human review and sends the same contract
    version to VRS AI only after approval. The current automated partner flow
    is American Home Shield authorization.
servers:
  - url: '<VRS_EXPRESS_DEV_BASE_URL>'
    description: VRS Express development intake for simulator tests
  - url: '<VRS_AI_DEV_BASE_URL>'
    description: VRS AI development intake after VRS Express approval
tags:
  - name: Authorization
x-vrs-contract-selection:
  rule: v8-if-any-v8-only-key-is-present-otherwise-v5
  v8OnlyKeys:
    - appliance_color
    - contract_number
    - purchase_year
    - symptom
  forbiddenVersionFields:
    - contractVersion
    - contract_version
x-vrs-dev-flow:
  inbound:
    endpoint: '<VRS_EXPRESS_DEV_BASE_URL>/vrs/authorize'
    callbackUrl: '<UPSTREAM_DEV_CALLBACK_URL>'
    acceptedMeaning: Pending human review; no VRS AI call has been made.
  outbound:
    endpoint: '<VRS_AI_DEV_BASE_URL>/vrs/authorize'
    callbackUrl: '<VRS_EXPRESS_DEV_CALLBACK_URL>'
    acceptedMeaning: Asynchronous admission; call execution is not proven.
x-vrs-hmac-test-vector:
  secret: vrs-ai-test-secret-do-not-use-in-prod
  rawBody: '{"version":1,"eventId":"evt_001","callId":"vrs_ai_call_456","soNo":"13538277","occurredAt":"2026-07-24T17:24:00Z","state":"approved","authNumber":"AHS-001","authorizedAmount":365.6}'
  expectedSignature: sha256=5631d513c93853fa58efc382eed0c19db14ab42b94b1fa44938bb44ee352d4b6
paths:
  /vrs/authorize:
    post:
      tags:
        - Authorization
      operationId: authorizeVrsBridgeRequest
      summary: Accept a strict V5 or V8 authorization request
      description: |
        On VRS Express, 202 creates a pending human-review ticket and does not
        call VRS AI. After approval, VRS Express calls the VRS AI development
        endpoint with the same version, a separate API key, and callback
        ownership replaced. On VRS AI, 202 means asynchronous admission only.
        VRS AI owns call admission and rate limits.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/V5AuthorizeRequest'
                - $ref: '#/components/schemas/V8AuthorizeRequest'
            examples:
              v5:
                summary: Complete V5 request including optional fields
                value:
                  service_order: '13538277'
                  tech_id: replace-with-dev-tech-id
                  tech_phone: '+12145550199'
                  tech_name: Example Technician
                  reason_for_call: authorization
                  callback_url: '<UPSTREAM_DEV_CALLBACK_URL>'
                  callback_secret: example-callback-secret-not-for-live-use
                  parts:
                    - part_id: WPW10503278
                      part_description: Electronic Control Board
                      sell_price: 245
                      part_function: Controls wash cycle timing and motor speed.
                  customer_name: Example Customer
                  customer_address: 100 Example Street, Example City, NC 27000
                  service_address: 100 Example Street, Example City, NC 27000
                  brand: Whirlpool
                  model_number: WTW5000DW1
                  serial_number: C31290822
                  appliance_type: Washer
                  appliance_age: 4
                  labor_amount: 120
                  tax_amount: 15.6
                  part_price: 245
                  appliance_location: laundry room
                  failure_cause: normal-wear
                  tech_recommendation: repair
                  repair_replace_rationale: The isolated board failure is repairable.
                  appliance_grade: mid
                  partner_id: ahs
                  appliance_photos: []
                  comments:
                    - tech_id: replace-with-dev-tech-id
                      work_item: failure_diagnosis
                      text: Diagnostic code F7E1 was confirmed.
                      timestamp: '2026-08-11T18:00:00Z'
              v8:
                summary: Complete V8 request
                value:
                  service_order: '13538278'
                  tech_id: replace-with-dev-tech-id
                  tech_phone: '+12145550199'
                  tech_name: Example Technician
                  reason_for_call: authorization
                  callback_url: '<UPSTREAM_DEV_CALLBACK_URL>'
                  callback_secret: example-callback-secret-not-for-live-use
                  parts:
                    - part_id: WPW10503278
                      part_description: Electronic Control Board
                      sell_price: 245
                      part_function: Controls wash cycle timing and motor speed.
                  customer_name: Example Customer
                  customer_address: 100 Example Street, Example City, NC 27000
                  service_address: 100 Example Street, Example City, NC 27000
                  brand: Whirlpool
                  model_number: WTW5000DW1
                  serial_number: C31290822
                  appliance_type: Washer
                  appliance_age: 4
                  labor_amount: 120
                  tax_amount: 15.6
                  part_price: 245
                  appliance_location: laundry room
                  failure_cause: normal-wear
                  tech_recommendation: repair
                  repair_replace_rationale: The isolated board failure is repairable.
                  appliance_grade: mid
                  partner_id: American Home Shield
                  appliance_photos: []
                  comments:
                    - tech_id: replace-with-dev-tech-id
                      work_item: failure_diagnosis
                      text: Diagnostic code F7E1 was confirmed.
                      timestamp: '2026-08-11T18:00:00Z'
                  appliance_color: stainless steel
                  contract_number: '1234567890'
                  purchase_year: 2022
                  symptom: Washer does not drain
      responses:
        '202':
          description: |
            VRS Express: pending human review and no VRS AI call. VRS AI:
            asynchronous admission only; call start is not proven. A strict V8
            request after a locally applied retryable failed V8 callback creates
            a new normal ticket, new bridge, and new public call ID immediately.
            Only prior retryable-failed V8 bridge tickets are excluded from
            legacy same-day duplicate checks; upstream forwarding remains
            independent, and V5/nonretryable V8 terminal repeats use ordinary
            ticket/service-order policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizeAccepted'
        '400':
          description: Strict request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            UNSUPPORTED_PARTNER returns its partner-specific body. Intake
            rejections UNKNOWN_TECHNICIAN, INACTIVE_TECHNICIAN,
            INVALID_TECHNICIAN_DISTRICT, and SUBMISSION_REJECTED when the
            rejection is not a conflict return the generic error and message
            body.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/UnsupportedPartner'
                  - $ref: '#/components/schemas/IntakeRejection'
        '409':
          description: |
            DUPLICATE_CALL returns the active-call body. Intake rejections
            NOT_A_TECHNICIAN, SUBMISSION_ALREADY_EXISTS, and
            SUBMISSION_REJECTED when the captured ticket status maps to a
            conflict return the generic error and message body.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/DuplicateCall'
                  - $ref: '#/components/schemas/IntakeRejection'
        '429':
          description: VRS AI admission limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimited'
        '500':
          description: Internal failure before admission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Dependency failure before admission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Temporarily unavailable or not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      callbacks:
        vrsAiResult:
          '{$request.body#/callback_url}':
            post:
              operationId: receiveVrsAiResult
              summary: Deliver one signed VRS AI result event
              description: |
                Sign the exact raw UTF-8 request-body bytes with HMAC-SHA256
                using callback_secret. Reuse the event ID and exact body on a
                retry, and refresh only the timestamp header.
              x-vrs-retry-policy:
                retryableStatusCodes:
                  - 500
                  - 502
                  - 503
                retryNetworkFailures: true
                maxAttempts: 5
                backoffSeconds:
                  - 1
                  - 2
                  - 4
                  - 8
                stableEventIdAndBody: true
              x-vrs-event-effects:
                approved:
                  ticketAction: approve
                  technicianSms: true
                partial:
                  ticketAction: approve
                  technicianSms: true
                denied:
                  ticketAction: reject
                  technicianSms: true
                failed:
                  ticketAction: status_only
                  technicianSms: false
                requires_info:
                  ticketAction: status_only
                  technicianSms: false
              parameters:
                - name: X-VRS-Signature
                  in: header
                  required: true
                  description: HMAC-SHA256 over exact raw request-body bytes
                  schema:
                    type: string
                    pattern: '^sha256=[0-9a-f]{64}$'
                - name: X-VRS-Event-Id
                  in: header
                  required: true
                  description: Must exactly equal body eventId
                  schema:
                    type: string
                    minLength: 1
                    maxLength: 100
                - name: X-VRS-Timestamp
                  in: header
                  required: true
                  description: Unix epoch milliseconds within five minutes
                  schema:
                    type: string
                    pattern: '^[0-9]+$'
              requestBody:
                required: true
                content:
                  application/json:
                    schema:
                      $ref: '#/components/schemas/WebhookEvent'
                    examples:
                      approved:
                        value:
                          version: 1
                          eventId: evt_approved_001
                          callId: vrs_ai_call_456
                          soNo: '13538278'
                          occurredAt: '2026-08-11T18:04:00Z'
                          state: approved
                          authNumber: AHS-001
                          authorizedAmount: 365.6
                          durationSec: 187
                      partial:
                        value:
                          version: 1
                          eventId: evt_partial_001
                          callId: vrs_ai_call_456
                          soNo: '13538278'
                          occurredAt: '2026-08-11T18:04:00Z'
                          state: partial
                          authNumber: AHS-002
                          authorizedAmount: 250
                          requestedAmount: 380.6
                          denyReason: Labor exceeded the coverage limit
                          durationSec: 214
                      denied:
                        value:
                          version: 1
                          eventId: evt_denied_001
                          callId: vrs_ai_call_456
                          soNo: '13538278'
                          occurredAt: '2026-08-11T18:04:00Z'
                          state: denied
                          denyReason: Repair cost exceeds the authorization limit
                          durationSec: 142
                      failed:
                        value:
                          version: 1
                          eventId: evt_failed_001
                          callId: vrs_ai_call_456
                          soNo: '13538278'
                          occurredAt: '2026-08-11T18:04:00Z'
                          state: failed
                          reason: busy
                          retryable: true
                      requiresInfo:
                        value:
                          version: 1
                          eventId: evt_info_001
                          callId: vrs_ai_call_456
                          soNo: '13538278'
                          occurredAt: '2026-08-11T18:04:00Z'
                          state: requires_info
                          question: What is the unit age?
                          field: appliance_age
                          urgency: hard
              responses:
                '200':
                  description: Processed or already processed
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/WebhookAccepted'
                '400':
                  description: Invalid body or event-ID mismatch
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/Error'
                '401':
                  description: Invalid signature or stale timestamp
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/Error'
                '500':
                  description: Transient VRS Express processing failure; retry
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/Error'
                '502':
                  description: Transient callback dependency failure; retry
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/Error'
                '503':
                  description: VRS Express callback temporarily unavailable; retry
                  content:
                    application/json:
                      schema:
                        $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Direction-specific development key exchanged securely
  schemas:
    Money:
      type: number
      minimum: 0
      maximum: 1000000
      multipleOf: 0.01
    V5Part:
      type: object
      additionalProperties: false
      required:
        - part_id
        - part_description
        - sell_price
        - part_function
      properties:
        part_id:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '.*\S.*'
        part_description:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '.*\S.*'
        sell_price:
          $ref: '#/components/schemas/Money'
        part_function:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '.*\S.*'
    V8Part:
      type: object
      additionalProperties: false
      required:
        - part_id
        - part_description
        - sell_price
        - part_function
      properties:
        part_id:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '.*\S.*'
        part_description:
          type: string
          minLength: 1
          maxLength: 500
          pattern: '.*\S.*'
        sell_price:
          $ref: '#/components/schemas/Money'
        part_function:
          type: string
          maxLength: 200
    Comment:
      type: object
      additionalProperties: false
      required:
        - tech_id
        - work_item
        - text
        - timestamp
      properties:
        tech_id:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '.*\S.*'
        work_item:
          type: string
          enum:
            - failure_diagnosis
            - tech_recommendation
            - appliance_features
            - customer_history
            - tech_observation
            - other
        text:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: '.*\S.*'
        timestamp:
          type: string
          format: date-time
    V5AuthorizeRequest:
      type: object
      additionalProperties: false
      required:
        - service_order
        - tech_id
        - tech_phone
        - tech_name
        - reason_for_call
        - callback_url
        - callback_secret
        - parts
        - customer_name
        - customer_address
        - service_address
        - brand
        - model_number
        - serial_number
        - appliance_type
        - appliance_age
        - labor_amount
        - tax_amount
        - part_price
        - appliance_location
        - failure_cause
        - tech_recommendation
        - repair_replace_rationale
      properties:
        service_order:
          type: string
          pattern: '^[0-9]{8}$'
        tech_id:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '.*\S.*'
        tech_phone:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
        tech_name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '.*\S.*'
        reason_for_call:
          type: string
          const: authorization
        callback_url:
          type: string
          format: uri
          description: |
            Inbound to VRS Express this must be the exact allowlisted clean HTTPS
            upstream development webhook. VRS Express replaces this
            value on dispatch with its exact clean HTTPS callback ending
            /api/integrations/vrs-ai/v1/webhook.
        callback_secret:
          type: string
          minLength: 16
          maxLength: 512
          writeOnly: true
        parts:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/V5Part'
        customer_name:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '.*\S.*'
        customer_address:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: '.*\S.*'
        service_address:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: '.*\S.*'
        brand:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '.*\S.*'
        model_number:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '.*\S.*'
        serial_number:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '.*\S.*'
        appliance_type:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '.*\S.*'
        appliance_age:
          type: number
          minimum: 0
          maximum: 100
        labor_amount:
          $ref: '#/components/schemas/Money'
        tax_amount:
          $ref: '#/components/schemas/Money'
        part_price:
          $ref: '#/components/schemas/Money'
        appliance_location:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '.*\S.*'
        failure_cause:
          type: string
          enum:
            - normal-wear
            - power-surge
            - impact
            - installation-error
            - abuse
            - age
            - other
        tech_recommendation:
          type: string
          enum:
            - repair
            - replace
        repair_replace_rationale:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        appliance_grade:
          type: string
          enum:
            - entry
            - mid
            - top
        partner_id:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '.*\S.*'
          description: Optional in V5; missing defaults to AHS at VRS Express intake
        appliance_photos:
          type: array
          maxItems: 10
          items:
            type: string
            format: uri
        comments:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Comment'
    V8AuthorizeRequest:
      type: object
      additionalProperties: false
      required:
        - service_order
        - tech_id
        - tech_phone
        - tech_name
        - reason_for_call
        - callback_url
        - callback_secret
        - parts
        - customer_name
        - customer_address
        - service_address
        - brand
        - model_number
        - serial_number
        - appliance_type
        - appliance_age
        - labor_amount
        - tax_amount
        - part_price
        - appliance_location
        - failure_cause
        - tech_recommendation
        - repair_replace_rationale
        - appliance_grade
        - partner_id
        - appliance_photos
        - comments
        - appliance_color
        - contract_number
        - purchase_year
        - symptom
      properties:
        service_order:
          type: string
          pattern: '^[0-9]{8}$'
        tech_id:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '.*\S.*'
        tech_phone:
          oneOf:
            - type: string
              pattern: '^\+[1-9][0-9]{7,14}$'
            - type: string
              const: N/A
        tech_name:
          type: string
          maxLength: 255
        reason_for_call:
          type: string
          const: authorization
        callback_url:
          type: string
          format: uri
          description: |
            Inbound to VRS Express this must be the exact allowlisted clean HTTPS
            upstream development webhook. VRS Express replaces this
            value on dispatch with its exact clean HTTPS callback ending
            /api/integrations/vrs-ai/v1/webhook.
        callback_secret:
          type: string
          minLength: 16
          maxLength: 512
          writeOnly: true
        parts:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/V8Part'
        customer_name:
          type: string
          maxLength: 255
        customer_address:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: '.*\S.*'
        service_address:
          type: string
          minLength: 1
          maxLength: 1000
          pattern: '.*\S.*'
        brand:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '.*\S.*'
        model_number:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '.*\S.*'
        serial_number:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '.*\S.*'
        appliance_type:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '.*\S.*'
        appliance_age:
          type: number
          minimum: 0
          maximum: 100
        labor_amount:
          $ref: '#/components/schemas/Money'
        tax_amount:
          $ref: '#/components/schemas/Money'
        part_price:
          $ref: '#/components/schemas/Money'
        appliance_location:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '.*\S.*'
        failure_cause:
          type: string
          enum:
            - normal-wear
            - power-surge
            - impact
            - installation-error
            - abuse
            - age
            - other
        tech_recommendation:
          type: string
          enum:
            - repair
            - replace
        repair_replace_rationale:
          type: string
        appliance_grade:
          type: string
          enum:
            - entry
            - mid
            - top
            - N/A
        partner_id:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '.*\S.*'
          description: Required in V8; AHS-normalized values and N/A are accepted
        appliance_photos:
          type: array
          maxItems: 10
          description: >-
            Direct HTTPS photo URLs. Sender-provided URLs pass through. When
            V8 receives an empty array and the VRS Express ticket has internal
            photos, VRS Express supplies direct signed Object Storage GET URLs
            valid for 24 hours at dispatch; VRS AI uses plain GET with no VRS
            Express API key or session.
          items:
            type: string
            format: uri
        comments:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Comment'
        appliance_color:
          type: string
          minLength: 1
          maxLength: 40
          pattern: '.*\S.*'
        contract_number:
          type: string
          minLength: 1
          pattern: '.*\S.*'
        purchase_year:
          oneOf:
            - type: integer
              minimum: 1
            - type: string
              const: TBD
            - type: string
              const: N/A
        symptom:
          type: string
          minLength: 1
          pattern: '.*\S.*'
    AuthorizeAccepted:
      type: object
      additionalProperties: false
      required:
        - call_id
        - service_order
        - state
        - created_at
      properties:
        call_id:
          type: string
          minLength: 1
          maxLength: 100
        service_order:
          type: string
          pattern: '^[0-9]{8}$'
        state:
          type: string
          const: queued
        created_at:
          type: string
          format: date-time
    DuplicateCall:
      type: object
      additionalProperties: false
      required:
        - error
        - message
        - existing_call_id
        - state
      properties:
        error:
          type: string
          const: DUPLICATE_CALL
        message:
          type: string
        existing_call_id:
          type: string
          minLength: 1
          maxLength: 100
        state:
          type: string
          const: in_progress
    UnsupportedPartner:
      type: object
      additionalProperties: false
      required:
        - error
        - message
        - partner_id
      properties:
        error:
          type: string
          const: UNSUPPORTED_PARTNER
        message:
          type: string
        partner_id:
          type: string
          maxLength: 50
    IntakeRejection:
      type: object
      additionalProperties: false
      required:
        - error
        - message
      properties:
        error:
          type: string
        message:
          type: string
    RateLimited:
      type: object
      additionalProperties: false
      required:
        - error
        - message
        - retry_after_seconds
      properties:
        error:
          type: string
          const: RATE_LIMITED
        message:
          type: string
        retry_after_seconds:
          type: integer
          minimum: 1
    ValidationError:
      type: object
      additionalProperties: false
      required:
        - error
        - message
        - fields
      properties:
        error:
          type: string
          const: VALIDATION_ERROR
        message:
          type: string
        fields:
          type: array
          items:
            type: string
    Error:
      type: object
      additionalProperties: false
      required:
        - error
        - message
      properties:
        error:
          type: string
        message:
          type: string
    EventEnvelope:
      type: object
      required:
        - version
        - eventId
        - callId
        - soNo
        - occurredAt
        - state
      properties:
        version:
          type: integer
          const: 1
        eventId:
          type: string
          minLength: 1
          maxLength: 100
        callId:
          type: string
          minLength: 1
          maxLength: 100
        soNo:
          type: string
          pattern: '^[0-9]{8}$'
        occurredAt:
          type: string
          format: date-time
        state:
          type: string
    ApprovedEvent:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          required:
            - authNumber
            - authorizedAmount
          properties:
            state:
              type: string
              const: approved
            authNumber:
              type: string
              minLength: 1
              maxLength: 100
            authorizedAmount:
              $ref: '#/components/schemas/Money'
            durationSec:
              type: integer
              minimum: 0
            recordingUrl:
              type: string
              format: uri
    PartialEvent:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          required:
            - authNumber
            - authorizedAmount
            - requestedAmount
          properties:
            state:
              type: string
              const: partial
            authNumber:
              type: string
              minLength: 1
              maxLength: 100
            authorizedAmount:
              $ref: '#/components/schemas/Money'
            requestedAmount:
              $ref: '#/components/schemas/Money'
            denyReason:
              type: string
              minLength: 1
              maxLength: 2000
            durationSec:
              type: integer
              minimum: 0
            recordingUrl:
              type: string
              format: uri
    DeniedEvent:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          required:
            - denyReason
          properties:
            state:
              type: string
              const: denied
            denyReason:
              type: string
              minLength: 1
              maxLength: 2000
            durationSec:
              type: integer
              minimum: 0
            recordingUrl:
              type: string
              format: uri
    FailedEvent:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          required:
            - reason
            - retryable
          properties:
            state:
              type: string
              const: failed
            reason:
              type: string
              enum:
                - busy
                - no_answer
                - ivr_error
                - agent_error
                - timeout
                - aborted
            retryable:
              type: boolean
    RequiresInfoEvent:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - type: object
          required:
            - question
            - field
            - urgency
          properties:
            state:
              type: string
              const: requires_info
            question:
              type: string
              minLength: 1
              maxLength: 2000
            field:
              type: string
              minLength: 1
              maxLength: 100
            urgency:
              type: string
              enum:
                - soft
                - hard
    WebhookEvent:
      oneOf:
        - $ref: '#/components/schemas/ApprovedEvent'
        - $ref: '#/components/schemas/PartialEvent'
        - $ref: '#/components/schemas/DeniedEvent'
        - $ref: '#/components/schemas/FailedEvent'
        - $ref: '#/components/schemas/RequiresInfoEvent'
      discriminator:
        propertyName: state
        mapping:
          approved: '#/components/schemas/ApprovedEvent'
          partial: '#/components/schemas/PartialEvent'
          denied: '#/components/schemas/DeniedEvent'
          failed: '#/components/schemas/FailedEvent'
          requires_info: '#/components/schemas/RequiresInfoEvent'
    WebhookAccepted:
      type: object
      additionalProperties: false
      required:
        - ok
        - eventId
        - deduped
      properties:
        ok:
          type: boolean
          const: true
        eventId:
          type: string
        deduped:
          type: boolean
